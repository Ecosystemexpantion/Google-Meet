<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EEM26 Live Class</title>
  <meta name="description" content="Join this live class on EEM26." />
  <meta name="theme-color" content="#05060b" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="EEM26 Live Class" />
  <meta property="og:description" content="You're invited to a live class. Tap to see when it starts and join." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="glass.css?v=__BUILD__" />
  <link rel="icon" href="app/mark.svg" type="image/svg+xml" />
  <style>
    .cls { display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(20px, 4vw, 48px); align-items: center; padding: clamp(28px, 6vw, 72px) 0 56px; }
    .cls h1 { font-size: clamp(36px, 6.4vw, 66px); margin: 14px 0 16px; }
    .cls .desc { font-size: 17px; color: var(--text-2); max-width: 52ch; white-space: pre-line; }
    .when { display: flex; gap: 14px; align-items: center; margin: 26px 0 22px; padding: 14px 18px; border-radius: 20px; width: fit-content; }
    .when .ico { color: var(--cyan); }
    .when b { display: block; font-weight: 600; }
    .when span { font-size: 13px; color: var(--text-3); }
    .host { display: flex; align-items: center; gap: 12px; margin-top: 26px; color: var(--text-2); font-size: 14px; }
    .host .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--grad); color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.08); }
    .panel { padding: clamp(24px, 4vw, 36px); display: flex; flex-direction: column; gap: 22px; }
    .state-title { font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: -.02em; text-align: center; }
    .state-sub { text-align: center; color: var(--text-2); margin-top: -12px; }
    .live-ring { width: 130px; height: 130px; margin: 6px auto 0; border-radius: 50%; display: grid; place-items: center; position: relative;
      background: radial-gradient(circle at 35% 25%, rgba(255,255,255,.16), rgba(255,93,108,.12) 60%); border: 1px solid rgba(255,93,108,.45); }
    .live-ring::before, .live-ring::after { content: ''; position: absolute; inset: -1px; border-radius: 50%; border: 1px solid rgba(255,93,108,.5); animation: ripple 2.4s ease-out infinite; }
    .live-ring::after { animation-delay: 1.2s; }
    .live-ring b { font-family: var(--display); font-size: 26px; letter-spacing: .08em; color: #ffd8dd; }
    @keyframes ripple { to { transform: scale(1.7); opacity: 0; } }
    .fine { font-size: 12.5px; color: var(--text-3); text-align: center; }
    footer { padding: 26px 0 40px; text-align: center; font-size: 12px; color: var(--text-3); }
    @media (max-width: 860px) { .cls { grid-template-columns: 1fr; padding-top: 28px; } }
  </style>
</head>
<body>
  <div class="aurora"><div class="stars"></div><div class="grain"></div></div>
  <header class="topbar glass">
    <a class="brand" href="index.html"><img src="app/mark.svg" alt="" /><span>EEM26 <small>Live classes</small></span></a>
    <span id="chip" class="chip">Loading…</span>
  </header>
  <main class="shell">
    <div id="app" class="cls"></div>
  </main>
  <footer>EEM26 Live · Works in any browser on your phone or computer — no download needed.</footer>
  <script src="config.js?v=__BUILD__"></script>
  <script type="module" src="js/class.js?v=__BUILD__"></script>
</body>
</html>
