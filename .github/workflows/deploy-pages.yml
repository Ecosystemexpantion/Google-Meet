name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # EEM26 Cast (Android app for sharing a phone screen) is built here and
      # published with the site at app/eem26-cast.apk. A failed app build
      # never blocks the website deploy.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build EEM26 Cast APK
        id: apk
        continue-on-error: true
        run: |
          gradle -p android assembleRelease --no-daemon --stacktrace
          mkdir -p app
          cp android/app/build/outputs/apk/release/app-release.apk app/eem26-live.apk
          cp app/eem26-live.apk app/eem26-cast.apk  # the old link keeps working
          # what the installed app compares against for in-app updates
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' android/app/build.gradle.kts)
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$code" "$name" > app/version.json

      # Version the site's own JS/CSS URLs so phones never run a stale copy
      # (GitHub Pages lets browsers cache files for 10 minutes).
      - name: Stamp asset versions
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s/__BUILD__/$v/g" *.html js/*.js js/live/*.js

      - name: Remove Android build output from the site
        run: rm -rf android/app/build android/.gradle android/build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          exclude_assets: '.github,*.yml,*.yaml,android,dev'
